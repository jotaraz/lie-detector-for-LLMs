let currentLayer = 1;
Plotly.newPlot('plot', LAYERS[1].data, LAYERS[1].layout, {responsive: true});

function switchLayer(lid) {
  if (lid === currentLayer) return;
  currentLayer = lid;
  [0,1,2].forEach(i => document.getElementById('btn-l'+i).classList.toggle('on', i===lid));
  const fd = LAYERS[lid];
  Plotly.react('plot', fd.data, fd.layout).then(() => applyVis());
}

// TM[c] = {pf: idx, pr: idx, gen: {"0": idx, "1": idx, ...}}
const TM  = {"0": {"pf": 0, "pr": 1, "gen": {"0": 2, "1": 3, "2": 4, "3": 5, "4": 6, "5": 7, "6": 8, "7": 9, "8": 10, "9": 11}}, "1": {"pf": 12, "pr": 13, "gen": {"0": 14, "1": 15, "2": 16, "3": 17, "4": 18, "5": 19, "6": 20, "7": 21, "8": 22, "9": 23}}, "2": {"pf": 24, "pr": 25, "gen": {"0": 26, "1": 27, "2": 28, "3": 29, "4": 30, "5": 31, "6": 32, "7": 33, "8": 34, "9": 35}}, "3": {"pf": 36, "pr": 37, "gen": {"0": 38, "1": 39, "2": 40, "3": 41, "4": 42, "5": 43, "6": 44, "7": 45, "8": 46, "9": 47}}, "4": {"pf": 48, "pr": 49, "gen": {"0": 50, "1": 51, "2": 52, "3": 53, "4": 54, "5": 55, "6": 56, "7": 57, "8": 58, "9": 59}}, "5": {"pf": 60, "pr": 61, "gen": {"0": 62, "1": 63, "2": 64, "3": 65, "4": 66, "5": 67, "6": 68, "7": 69, "8": 70, "9": 71}}, "6": {"pf": 72, "pr": 73, "gen": {"0": 74, "1": 75, "2": 76, "3": 77, "4": 78, "5": 79, "6": 80, "7": 81, "8": 82, "9": 83}}, "7": {"pf": 84, "pr": 85, "gen": {"0": 86, "1": 87, "2": 88, "3": 89, "4": 90, "5": 91, "6": 92, "7": 93, "8": 94, "9": 95}}, "8": {"pf": 96, "pr": 97, "gen": {"0": 98, "1": 99, "2": 100, "3": 101, "4": 102, "5": 103, "6": 104, "7": 105, "8": 106, "9": 107}}, "9": {"pf": 108, "pr": 109, "gen": {"0": 110, "1": 111, "2": 112, "3": 113, "4": 114, "5": 115, "6": 116, "7": 117, "8": 118, "9": 119}}, "10": {"pf": 120, "pr": 121, "gen": {"0": 122, "1": 123, "2": 124, "3": 125, "4": 126, "5": 127, "6": 128, "7": 129, "8": 130, "9": 131}}, "11": {"pf": 132, "pr": 133, "gen": {"0": 134, "1": 135, "2": 136, "3": 137, "4": 138, "5": 139, "6": 140, "7": 141, "8": 142, "9": 143}}};
const N   = 12;
const NPR = 10;   // number of prefix positions (gen branches per conv)
const NT  = 144;

// Three independent toggle dimensions that compose multiplicatively
const CS = Object.fromEntries([...Array(N).keys()].map(i => [i, true]));
const TS = {pf: true, pr: true, gen: true};
const GS = Object.fromEntries([...Array(NPR).keys()].map(i => [i, true]));

function computeVis() {
  const v = new Array(NT).fill(false);
  for (let c = 0; c < N; c++) {
    if (!CS[c]) continue;
    const t = TM[c];
    if (TS.pf) v[t.pf] = true;
    if (TS.pr) v[t.pr] = true;
    if (TS.gen) {
      for (const [iStr, idx] of Object.entries(t.gen)) {
        if (GS[iStr]) v[idx] = true;
      }
    }
  }
  return v;
}

function applyVis() {
  Plotly.restyle('plot', {visible: computeVis()});
}

function toggleType(k) {
  TS[k] = !TS[k];
  document.getElementById('btn-' + k).classList.toggle('on', TS[k]);
  applyVis();
}

function toggleConv(c) {
  CS[c] = !CS[c];
  document.getElementById('btn-c' + c).classList.toggle('on', CS[c]);
  applyVis();
}

function setAll(show) {
  for (let c = 0; c < N; c++) {
    CS[c] = show;
    document.getElementById('btn-c' + c).classList.toggle('on', show);
  }
  applyVis();
}

function toggleGen(i) {
  GS[i] = !GS[i];
  document.getElementById('btn-gi' + i).classList.toggle('on', GS[i]);
  applyVis();
}

function setAllGen(show) {
  for (let i = 0; i < NPR; i++) {
    GS[i] = show;
    document.getElementById('btn-gi' + i).classList.toggle('on', show);
  }
  applyVis();
}
