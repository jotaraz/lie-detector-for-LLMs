<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocomp2 Visualization</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
  background: #0d1117;
  color: #c9d1d9;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Left panel ──────────────────────────────────────────────── */
#list-panel {
  width: 340px;
  min-width: 240px;
  min-height: 0;
  border-right: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  resize: horizontal;
}

#list-header {
  padding: 10px 14px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  color: #58a6ff;
  font-weight: bold;
  font-size: 14px;
  flex-shrink: 0;
  user-select: none;
}

#list-header span {
  color: #6e7681;
  font-size: 11px;
  font-weight: normal;
}

#conv-list {
  overflow-y: auto;
  flex: 1;
  padding: 6px;
}

.conv-card {
  padding: 8px 10px;
  margin-bottom: 4px;
  border: 1px solid #21262d;
  border-radius: 5px;
  cursor: pointer;
  background: #161b22;
  transition: border-color 0.12s, background 0.12s;
}
.conv-card:hover   { border-color: #388bfd; background: #1c2432; }
.conv-card.active  { border-color: #58a6ff; background: #1c2432; }

.card-idx      { color: #6e7681; font-size: 10px; margin-bottom: 2px; }
.card-scenario {
  color: #8b949e; font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.card-question {
  color: #79c0ff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.card-answer {
  color: #c9d1d9; font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Right panel ─────────────────────────────────────────────── */
#detail-panel {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
}

#detail-inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 100%;
}

#placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #484f58;
  font-size: 15px;
}

.info-box {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 6px;
  padding: 9px 13px;
}
.info-label {
  color: #58a6ff;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.info-text {
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  color: #8b949e;
}
.info-text.bright { color: #c9d1d9; }

.collapsible { cursor: pointer; }
.collapsible .toggle {
  color: #484f58; font-size: 10px; margin-left: 6px;
}
.collapsed .info-text {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Model tabs */
.model-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 4px 12px;
  border: 1px solid #30363d;
  border-radius: 20px;
  cursor: pointer;
  background: #161b22;
  color: #8b949e;
  font-size: 12px;
  transition: all 0.12s;
  user-select: none;
}
.tab:hover  { border-color: #388bfd; color: #c9d1d9; }
.tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

/* Answer frames */
.answer-frame {
  background: #0d2137;
  border: 1px solid #1f6feb;
  border-radius: 6px;
  padding: 10px 14px;
}
.frame-label {
  color: #58a6ff;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.frame-text {
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  color: #e6edf3;
}

/* Autocomplete table */
.ac-wrap {
  border: 1px solid #30363d;
  border-radius: 6px;
  overflow: hidden;
}
.ac-table {
  width: 100%;
  border-collapse: collapse;
  background: #161b22;
}
.ac-table thead tr { background: #21262d; }
.ac-table th {
  padding: 6px 10px;
  text-align: left;
  color: #58a6ff;
  font-size: 10px;
  letter-spacing: 0.08em;
  border-bottom: 1px solid #30363d;
}
.ac-table td {
  padding: 6px 10px;
  vertical-align: top;
  border-bottom: 1px solid #21262d;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.ac-table tr:last-child td { border-bottom: none; }
.ac-table tbody tr:hover td { background: #1c2432; }

.col-i      { width: 28px; color: #6e7681; font-size: 11px; }
.col-prefix { width: 36%; color: #8b949e; }
.col-comp   { color: #c9d1d9; }

.new-token    { color: #e3b341; font-weight: bold; }
.empty-label  { color: #484f58; font-style: italic; }

sup, sub { font-size: 0.75em; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
</style>
</head>

    let prefixCell;
    if (i === 0) {
      prefixCell = '<span class="empty-label">(empty)</span>';
    } else {
      const oldTokens = refTokens.slice(0, i - 1).join('');
      const newToken  = refTokens[i - 1];
      prefixCell = esc(oldTokens) + '<span class="new-token">' + esc(newToken) + '</span>';
    }

    const compText = ac.text;
    const compCell = compText
      ? esc(compText)
      : '<span class="empty-label">(empty)</span>';

    rowsHtml += `
      <tr>
        <td class="col-i">${i}</td>
        <td class="col-prefix">${prefixCell}</td>
        <td class="col-comp">${compCell}</td>
      </tr>`;
  });

  detailEl.innerHTML = `
    <!-- S^(k) -->
    <div class="info-box collapsible collapsed">
      <div class="info-label">S<sup>(${k})</sup> &mdash; System prompt <span class="toggle">[+]</span></div>
      <div class="info-text">${esc(conv.system_prompt)}</div>
    </div>

    <!-- U^(k) -->
    <div class="info-box">
      <div class="info-label">U<sup>(${k})</sup> &mdash; User prompt</div>
      <div class="info-text bright">${esc(conv.user_prompt)}</div>
    </div>

    <!-- Model tabs -->
    <div class="model-tabs">${tabsHtml}</div>

    <!-- Top frame: R^(k) -->
    <div class="answer-frame">
      <div class="frame-label">&#9650; R<sup>(${k})</sup> &mdash; Reference answer &nbsp;<span style="color:#6e7681;font-size:10px;font-weight:normal">(n<sup>(${k})</sup>=${md.n} tokens)</span></div>
      <div class="frame-text">${esc(md.reference_answer)}</div>
    </div>

    <!-- Autocomplete table -->
    <div class="ac-wrap">
      <table class="ac-table">
        <thead>
          <tr>
            <th class="col-i"><i>i</i></th>
            <th>R<sup>(${k})</sup><sub><i>i</i></sub> &nbsp;<span style="color:#6e7681;font-size:10px">(prefix &mdash; <span style="color:#e3b341">gold</span> = new token)</span></th>
            <th>AC<sup>(${k})</sup><sub><i>i</i></sub> &nbsp;<span style="color:#6e7681;font-size:10px">(model completion after prefix)</span></th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>

    <!-- Bottom frame: R^(k) -->
    <div class="answer-frame">
      <div class="frame-label">&#9660; R<sup>(${k})</sup> &mdash; Reference answer</div>
      <div class="frame-text">${esc(md.reference_answer)}</div>
    </div>
  `;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function trunc(str, n) {
  return str.length > n ? str.slice(0, n) + '\u2026' : str;
}
</script>
</body>
</html>
